<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character encoding & viewport -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary metadata -->
  <title>404 – Page Not Found · OpsPulse</title>
  <meta name="description" content="The page you requested could not be found. Return to the OpsPulse System Health Command Center." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Theme color -->
  <meta name="theme-color" content="#0B1220" />

  <!-- Inline SVG favicon (same as index.html) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1220'/%3E%3Ccircle cx='16' cy='16' r='13' stroke='%2322D3EE' stroke-width='2.5' fill='none'/%3E%3Cpolyline points='7,19 11,13 15,17 19,10 23,14' stroke='%2322D3EE' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <style>
    /* ── Design tokens (mirrors index.html / style.css) ── */
    :root {
      --bg:      #0B1220;
      --surface: #111A2E;
      --border:  #1F2B45;
      --text:    #E5EAF3;
      --muted:   #94A3B8;
      --primary: #22D3EE;
      --danger:  #EF4444;
      --radius:  12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* Matching dotted grid background from main dashboard */
      background-image:
        radial-gradient(circle, rgba(34,211,238,0.07) 1px, transparent 1px),
        radial-gradient(circle, rgba(34,211,238,0.04) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px;
      background-position: 0 0, 12px 12px;
    }

    .card-404 {
      background: rgba(17, 26, 46, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
    }

    .error-code {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      color: var(--primary);
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    .error-msg {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: var(--primary);
      color: #000;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 200ms ease, transform 200ms ease;
    }
    .btn-home:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn-home:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.03em;
    }

    footer {
      margin-top: 32px;
      font-size: 11px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <main class="card-404" role="main" aria-labelledby="error-heading">

    <!-- OpsPulse logo mark -->
    <div class="logo-row" aria-label="OpsPulse">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true" style="color:var(--primary)">
        <circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2"/>
        <polyline points="5,13 8,9 11,12 14,7 17,10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      OpsPulse
    </div>

    <p class="error-code" aria-hidden="true">404</p>
    <h1 class="error-title" id="error-heading">Page Not Found</h1>
    <p class="error-msg">
      The page you're looking for doesn't exist or has been moved.<br>
      Let's get you back to the dashboard.
    </p>

    <a href="index.html" class="btn-home">
      <!-- Arrow-left icon -->
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <polyline points="9,2 4,7 9,12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Dashboard
    </a>

  </main>

  <footer>OpsPulse v2.4.1 · System Health Command Center</footer>

</body>
</html>
